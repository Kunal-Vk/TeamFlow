name: 🚀 TeamFlow CI/CD Deployment Pipeline

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

jobs:

  lint-and-test:
    name: 🔍 Lint & Code Validation
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: 📦 Validate Backend Build
        run: |
          cd backend
          npm ci
          npm run build

      - name: 📦 Validate Frontend Build
        run: |
          cd frontend
          npm ci
          npm run build
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000/api"

  deploy:
    name: 🚀 Deploy to AWS EC2
    needs: lint-and-test
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECURITY_GROUP_ID: ${{ secrets.AWS_SECURITY_GROUP_ID }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔑 Configure AWS Credentials (for JIT Access if enabled)
        if: ${{ env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECURITY_GROUP_ID != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: 🛡️ [Phase 3] Enable JIT Ingress SSH Access (Authorize Runner IP)
        if: ${{ env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECURITY_GROUP_ID != '' }}
        id: jit-enable
        run: |
          RUNNER_IP=$(curl -s https://checkip.amazonaws.com)
          echo "RUNNER_IP=${RUNNER_IP}" >> $GITHUB_ENV
          echo "::notice ::Whitelisting GitHub Runner IP ${RUNNER_IP}/32 for port 22 access..."
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.AWS_SECURITY_GROUP_ID }} \
            --protocol tcp \
            --port 22 \
            --cidr ${RUNNER_IP}/32

      - name: 🚀 Deploy Application to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 30m
          command_timeout: 30m
          script: |
            set -e
            export DEBIAN_FRONTEND=noninteractive
            echo "📦 Deploying TeamFlow on EC2..."

            # Ensure Swap is configured for smooth Next.js compilation
            if [ ! -f /swapfile ] && [ $(free -m | awk '/^Swap:/ {print $2}') -eq 0 ]; then
              echo "🧠 Creating 2GB Swap space for Docker build..."
              sudo fallocate -l 2G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=2048
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile
              echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab || true
            fi
            
            # Ensure target directory exists
            sudo mkdir -p /opt/teamflow
            sudo chown -R $USER:$USER /opt/teamflow
            cd /opt/teamflow

            # Clone or Pull repository
            if [ -d ".git" ]; then
              echo "🔄 Pulling latest code..."
              git fetch --all
              git reset --hard origin/main || git reset --hard origin/master
            else
              echo "📥 Initializing repository..."
              git init
              git remote add origin https://github.com/${{ github.repository }}.git || git remote set-url origin https://github.com/${{ github.repository }}.git
              git fetch --all
              git checkout -f main || git checkout -f master
            fi

            # Create / Update Environment Variables File
            cat << 'EOF' > .env
            PORT=8000
            NODE_ENV=production
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_EXPIRES_IN=${{ secrets.JWT_EXPIRES_IN || '7d' }}
            CORS_ORIGIN=${{ secrets.CORS_ORIGIN }}
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            EOF


            # Safely release any stale apt/dpkg lock left by previous runs or unattended-upgrades
            wait_for_apt() {
              sudo systemctl stop unattended-upgrades.service apt-daily.timer apt-daily-upgrade.timer 2>/dev/null || true
              sudo killall -9 apt apt-get unattended-upgrade unattended-upgr 2>/dev/null || true
              sudo rm -f /var/lib/apt/lists/lock /var/cache/apt/archives/lock /var/lib/dpkg/lock* /var/lib/dpkg/lock-frontend 2>/dev/null || true
              sudo dpkg --configure -a 2>/dev/null || true
            }

            # Ensure PostgreSQL is installed and configured natively on Ubuntu
            if ! command -v psql &> /dev/null; then
              echo "🗄️ Installing and configuring PostgreSQL on Ubuntu..."
              wait_for_apt
              sudo apt-get update -y
              wait_for_apt
              sudo apt-get install -y postgresql postgresql-contrib
              sudo systemctl enable postgresql && sudo systemctl start postgresql

              PG_CONF=$(sudo find /etc/postgresql/ -name "postgresql.conf" 2>/dev/null | head -n 1)
              PG_HBA=$(sudo find /etc/postgresql/ -name "pg_hba.conf" 2>/dev/null | head -n 1)

              if [ -n "$PG_CONF" ] && [ -f "$PG_CONF" ]; then
                sudo sed -i "s/#listen_addresses = 'localhost'/listen_addresses = '*'/g" "$PG_CONF"
                sudo sed -i "s/listen_addresses = 'localhost'/listen_addresses = '*'/g" "$PG_CONF"
              fi

              if [ -n "$PG_HBA" ] && [ -f "$PG_HBA" ]; then
                echo "host    all             all             172.16.0.0/12            md5" | sudo tee -a "$PG_HBA"
                echo "host    all             all             127.0.0.1/32             md5" | sudo tee -a "$PG_HBA"
                echo "host    all             all             0.0.0.0/0               md5" | sudo tee -a "$PG_HBA"
              fi
              sudo systemctl restart postgresql
            fi

            # Automatically initialize Database, User, and Tables with full permissions
            echo "🗄️ Initializing PostgreSQL database, user, tables, and schema permissions..."
            sudo -u postgres psql -c "
            DO \$\$
            BEGIN
              IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'DADA') THEN
                CREATE USER \"DADA\" WITH PASSWORD 'postgres';
              END IF;
              IF NOT EXISTS (SELECT FROM pg_database WHERE datname = 'teamflow') THEN
                CREATE DATABASE teamflow OWNER \"DADA\";
              END IF;
            END
            \$\$;
            GRANT ALL PRIVILEGES ON DATABASE teamflow TO \"DADA\";
            " 2>/dev/null || true

            sudo -u postgres psql -d teamflow -c '
            CREATE EXTENSION IF NOT EXISTS "pgcrypto";

            CREATE TABLE IF NOT EXISTS "users" (
                "id" UUID PRIMARY KEY DEFAULT gen_random_uuid(),
                "name" VARCHAR(100) NOT NULL,
                "email" VARCHAR(255) NOT NULL UNIQUE,
                "password" VARCHAR(255) NOT NULL,
                "role" VARCHAR(20),
                "organization_id" UUID,
                "created_at" TIMESTAMP DEFAULT now() NOT NULL,
                "updated_at" TIMESTAMP DEFAULT now() NOT NULL
            );

            CREATE TABLE IF NOT EXISTS "organizations" (
                "id" UUID PRIMARY KEY DEFAULT gen_random_uuid(),
                "name" VARCHAR(255) NOT NULL,
                "slug" VARCHAR(100) NOT NULL UNIQUE,
                "description" TEXT,
                "owner_id" UUID NOT NULL REFERENCES "users"("id"),
                "created_at" TIMESTAMP DEFAULT now() NOT NULL,
                "updated_at" TIMESTAMP DEFAULT now() NOT NULL
            );

            CREATE TABLE IF NOT EXISTS "refresh_tokens" (
                "id" UUID PRIMARY KEY DEFAULT gen_random_uuid(),
                "user_id" UUID NOT NULL REFERENCES "users"("id") ON DELETE CASCADE,
                "token" VARCHAR(512) NOT NULL UNIQUE,
                "expires_at" TIMESTAMP NOT NULL,
                "created_at" TIMESTAMP DEFAULT now() NOT NULL
            );

            CREATE TABLE IF NOT EXISTS "projects" (
                "id" UUID PRIMARY KEY DEFAULT gen_random_uuid(),
                "organization_id" UUID NOT NULL REFERENCES "organizations"("id") ON DELETE CASCADE,
                "name" VARCHAR(255) NOT NULL,
                "slug" VARCHAR(100) NOT NULL,
                "description" TEXT,
                "created_at" TIMESTAMP DEFAULT now() NOT NULL,
                "updated_at" TIMESTAMP DEFAULT now() NOT NULL
            );
            CREATE UNIQUE INDEX IF NOT EXISTS "projects_org_slug_unique" ON "projects" ("organization_id", "slug");

            CREATE TABLE IF NOT EXISTS "project_members" (
                "id" UUID PRIMARY KEY DEFAULT gen_random_uuid(),
                "project_id" UUID NOT NULL REFERENCES "projects"("id") ON DELETE CASCADE,
                "user_id" UUID NOT NULL REFERENCES "users"("id") ON DELETE CASCADE,
                "created_at" TIMESTAMP DEFAULT now() NOT NULL,
                CONSTRAINT "project_members_project_user_unique" UNIQUE("project_id", "user_id")
            );

            CREATE TABLE IF NOT EXISTS "teams" (
                "id" UUID PRIMARY KEY DEFAULT gen_random_uuid(),
                "organization_id" UUID NOT NULL REFERENCES "organizations"("id") ON DELETE CASCADE,
                "name" VARCHAR(255) NOT NULL,
                "description" TEXT,
                "created_at" TIMESTAMP DEFAULT now() NOT NULL,
                "updated_at" TIMESTAMP DEFAULT now() NOT NULL
            );

            CREATE TABLE IF NOT EXISTS "team_members" (
                "id" UUID PRIMARY KEY DEFAULT gen_random_uuid(),
                "team_id" UUID NOT NULL REFERENCES "teams"("id") ON DELETE CASCADE,
                "user_id" UUID NOT NULL REFERENCES "users"("id") ON DELETE CASCADE,
                "created_at" TIMESTAMP DEFAULT now() NOT NULL,
                CONSTRAINT "team_members_team_user_unique" UNIQUE("team_id", "user_id")
            );

            CREATE TABLE IF NOT EXISTS "tasks" (
                "id" UUID PRIMARY KEY DEFAULT gen_random_uuid(),
                "project_id" UUID NOT NULL REFERENCES "projects"("id") ON DELETE CASCADE,
                "title" VARCHAR(500) NOT NULL,
                "description" TEXT,
                "status" VARCHAR(20) DEFAULT '\''TODO'\'' NOT NULL,
                "priority" VARCHAR(10) DEFAULT '\''MEDIUM'\'' NOT NULL,
                "assigned_to" UUID REFERENCES "users"("id") ON DELETE SET NULL,
                "due_date" DATE,
                "created_at" TIMESTAMP DEFAULT now() NOT NULL,
                "updated_at" TIMESTAMP DEFAULT now() NOT NULL
            );

            CREATE TABLE IF NOT EXISTS "task_assignees" (
                "id" UUID PRIMARY KEY DEFAULT gen_random_uuid(),
                "task_id" UUID NOT NULL REFERENCES "tasks"("id") ON DELETE CASCADE,
                "user_id" UUID NOT NULL REFERENCES "users"("id") ON DELETE CASCADE,
                "created_at" TIMESTAMP DEFAULT now() NOT NULL,
                CONSTRAINT "task_assignees_task_user_unique" UNIQUE("task_id", "user_id")
            );

            CREATE TABLE IF NOT EXISTS "comments" (
                "id" UUID PRIMARY KEY DEFAULT gen_random_uuid(),
                "task_id" UUID NOT NULL REFERENCES "tasks"("id") ON DELETE CASCADE,
                "user_id" UUID NOT NULL REFERENCES "users"("id") ON DELETE CASCADE,
                "content" TEXT NOT NULL,
                "created_at" TIMESTAMP DEFAULT now() NOT NULL,
                "updated_at" TIMESTAMP DEFAULT now() NOT NULL
            );

            ALTER SCHEMA public OWNER TO "DADA";
            GRANT ALL ON SCHEMA public TO "DADA";
            GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO "DADA";
            GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO "DADA";
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO "DADA";
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO "DADA";

            ALTER TABLE IF EXISTS users OWNER TO "DADA";
            ALTER TABLE IF EXISTS organizations OWNER TO "DADA";
            ALTER TABLE IF EXISTS refresh_tokens OWNER TO "DADA";
            ALTER TABLE IF EXISTS projects OWNER TO "DADA";
            ALTER TABLE IF EXISTS project_members OWNER TO "DADA";
            ALTER TABLE IF EXISTS teams OWNER TO "DADA";
            ALTER TABLE IF EXISTS team_members OWNER TO "DADA";
            ALTER TABLE IF EXISTS tasks OWNER TO "DADA";
            ALTER TABLE IF EXISTS task_assignees OWNER TO "DADA";
            ALTER TABLE IF EXISTS comments OWNER TO "DADA";
            ' 2>/dev/null || true

            # Ensure Docker & Docker Compose are installed on EC2
            if ! command -v docker &> /dev/null; then
              echo "🐳 Installing Docker & Docker Compose..."
              wait_for_apt
              sudo apt-get update -y
              wait_for_apt
              sudo apt-get install -y docker.io docker-compose || sudo apt-get install -y docker.io docker-compose-plugin
              sudo systemctl enable docker && sudo systemctl start docker
              sudo usermod -aG docker $USER
            fi

            # Ensure Nginx is installed and directories exist
            if ! command -v nginx &> /dev/null; then
              echo "📦 Installing Nginx..."
              wait_for_apt
              sudo apt-get update -y
              wait_for_apt
              sudo apt-get install -y nginx
            fi
            sudo mkdir -p /etc/nginx/sites-available /etc/nginx/sites-enabled

            # Sync Nginx Config if modified
            if [ -f "nginx/teamflow.conf" ]; then
              sudo cp nginx/teamflow.conf /etc/nginx/sites-available/teamflow
              sudo ln -sf /etc/nginx/sites-available/teamflow /etc/nginx/sites-enabled/teamflow
              sudo rm -f /etc/nginx/sites-enabled/default
              sudo nginx -t && (sudo systemctl reload nginx || sudo systemctl restart nginx)
            fi

            # Build and Launch Containers
            echo "🐳 Starting Docker containers..."
            (docker compose up -d --build --remove-orphans) || (docker-compose up -d --build --remove-orphans)

            # Run Database Migrations
            echo "🗄️ Running Database Migrations..."
            (docker compose exec -T backend npm run db:generate) || (docker-compose exec -T backend npm run db:generate) || true
            (docker compose exec -T backend npm run db:migrate) || (docker-compose exec -T backend npm run db:migrate) || true


            # Container Health Smoke Test
            echo "🏥 Running Smoke Test..."
            sleep 5
            curl --fail http://localhost:8000/api/health || (echo "❌ Backend Health Check Failed!" && exit 1)
            curl --fail http://localhost:3000 || (echo "❌ Frontend Health Check Failed!" && exit 1)

            echo "✅ TeamFlow Successfully Deployed & Healthy!"

      - name: 🔒 [Phase 3 Cleanup] Revoke JIT Ingress SSH Access
        if: always() && env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECURITY_GROUP_ID != ''
        run: |
          echo "::notice ::Revoking GitHub Runner IP ${RUNNER_IP}/32 from Security Group..."
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ secrets.AWS_SECURITY_GROUP_ID }} \
            --protocol tcp \
            --port 22 \
            --cidr ${RUNNER_IP}/32 || true

